name: Open Government, New South Wales

description: API.NSW (api.nsw.gov.au) is the New South Wales Government's API portal,
  originally developed by the NSW Department of Finance, Services and Innovation and
  now operated under the Department of Customer Service. It gives developers, researchers
  and other parties a catalogue of government APIs - such as the Fuel API with live
  prices for 2,500+ NSW fuel stations, the Security licence API and the Register of
  Pharmacies - with free sign-up for API access, alongside the related open data portal
  data.nsw.gov.au.

