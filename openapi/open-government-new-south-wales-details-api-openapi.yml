paths:
  /hbccheckregister/v1/details:
    get:
      tags:
      - Details
      description: Provides a set of detailed information about the individual certificate selected such as the insurance certificate number, principal contractor and licence number, work covered by the insurance, property address and claims paid.
      summary: Details Get Method
      deprecated: false
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer {token}, where <b>{token}</b> is the value obtained from accesstoken call under security.
        schema:
          type: string
          default: Bearer {token}
      - name: apikey
        in: header
        required: true
        description: Api key value obtained from your approved app.
        schema:
          type: string
      - name: licenceid
        in: query
        required: true
        description: The 'licenceId' value for a licence returned by a browse or verify request. Every licence in the OneGov system is given a unique identifier. This item contains that unique identifier.
        schema:
          type: string
          default: 1-17YIOEU
      responses:
        '200':
          description: Success
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/details_results'
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bad_request'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invalid_token_response'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server_error'
      operationId: getHbccheckregisterV1Details
      x-operation-id-source: derived
    servers:
    - url: https://api.onegov.nsw.gov.au/
