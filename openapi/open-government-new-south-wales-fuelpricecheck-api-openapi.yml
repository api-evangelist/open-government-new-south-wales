components:
  schemas:
    station_prices:
      type: object
      required:
      - prices
      properties:
        prices:
          type: array
          items:
            title: price
            type: object
            required:
            - fueltype
            - price
            - lastupdated
            properties:
              fueltype:
                type: string
                example: U91
              price:
                type: number
                example: '151.9'
              lastupdated:
                type: string
                example: 30/09/2019 00:01:55
    nearby_prices_v2:
      type: object
      required:
      - stations
      - prices
      properties:
        stations:
          type: array
          items:
            title: station
            type: object
            required:
            - stationid
            - brandid
            - brand
            - code
            - name
            - address
            - location
            - state
            properties:
              stationid:
                type: string
                example: 1-GN9E-441
              brandid:
                type: string
                example: 1-GFYV-0
              brand:
                type: string
                example: BP
              code:
                type: integer
                example: '382'
              name:
                type: string
                example: BP Wyoming
              address:
                type: string
                example: 481 Pacific Highway, Wyoming NSW 2250
              location:
                type: object
                required:
                - latitude
                - longitude
                - distance
                properties:
                  latitude:
                    type: number
                    example: '-33.408004'
                  longitude:
                    type: number
                    example: '151.351119'
                  distance:
                    type: number
                    example: '5.96'
              state:
                type: string
                example: TAS
        prices:
          type: array
          items:
            type: object
            title: price
            required:
            - stationcode
            - fueltype
            - price
            - priceunit
            - description
            - lastupdated
            properties:
              stationcode:
                type: integer
                example: '322'
              fueltype:
                type: string
                example: P95
              price:
                type: number
                example: '186.9'
              priceunit:
                type: string
                example: litre
              description:
                type: string
              lastupdated:
                type: string
                example: '2019-09-29 22:48:51'
              state:
                type: string
                example: TAS
    current_prices:
      type: object
      required:
      - stations
      - prices
      properties:
        stations:
          type: array
          items:
            title: station
            type: object
            required:
            - brandid
            - stationid
            - brand
            - code
            - name
            - address
            - location
            properties:
              brandid:
                type: string
              stationid:
                type: string
              brand:
                type: string
                example: United
              code:
                type: string
                example: '2051'
              name:
                type: string
                example: United Petroleum Wilberforce
              address:
                type: string
                example: 539 Wilberforce Rd, WILBERFORCE NSW 2756
              location:
                type: object
                required:
                - latitude
                - longitude
                properties:
                  latitude:
                    example: '-33.563205'
