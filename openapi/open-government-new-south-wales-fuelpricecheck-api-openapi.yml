openapi: 3.2.0
info:
  title: Open Government New South Wales Fuel Price Check API
  version: 2.0.05
  contact: {}
  description: 'Operations tagged FuelPriceCheck across 2 of this provider''s published API definitions: open-government-new-south-wales-fuel-swagger.json, open-government-new-south-wales-fuel-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.onegov.nsw.gov.au/
tags:
- name: FuelPriceCheck
paths:
  /FuelPriceCheck/v1/fuel/prices/location:
    post:
      tags:
      - FuelPriceCheck
      description: Returns current fuel prices for a single fuel type and a named location (ie Suburb or postcode). This API returns data for NSW.
      summary: Get fuel prices for location
      deprecated: false
      parameters:
      - name: Authorization
        in: header
        required: true
        description: '''Bearer {token}'', where <b>{token}</b> is the value obtained from accesstoken call under security.'
        schema:
          type: string
      - name: Content-Type
        in: header
        required: true
        description: Content-Type should be 'application/json; charset=utf-8'
        schema:
          type: string
      - name: apikey
        in: header
        required: true
        description: Api key value obtained from your approved app.
        schema:
          type: string
      - name: transactionid
        in: header
        required: true
        description: Unique ID of this call
        schema:
          type: string
      - name: requesttimestamp
        in: header
        required: true
        description: UTC date and time of request. Format dd/MM/yyyy hh:mm:ss AM/PM
        schema:
          type: string
      responses:
        '200':
          description: Success
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/location_prices'
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/get_fuel_prices_for_location_request'
        required: true
      operationId: postFuelPriceCheckV1FuelPricesLocation
      x-operation-id-source: derived
    servers:
    - url: https://api.onegov.nsw.gov.au/
