paths:
  /hbccheckregister/v1/browse:
    get:
      tags:
      - Browse
      description: Provides the user with a search option to enter in partial information and returns a list of the search.
      summary: Browse Get Method
      deprecated: false
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer {token}, where <b>{token}</b> is the value obtained from accesstoken call under security.
        schema:
          type: string
          default: Bearer {token}
      - name: searchText
        in: query
        required: true
        description: The collection of words to be searched for. The minimum word length is two characters, noise words such as 'and', 'or' and 'the' are discarded. Most punctuation characters are discarded, the dash [-] and apostrophe [&#39;] characters being the only exceptions
        schema:
          type: string
          default: Real Estate
      - name: apikey
        in: header
        required: true
        description: Api key value obtained from your approved app.
        schema:
          type: string
      responses:
        '200':
          description: Success
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/browse_results'
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bad_request'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invalid_token_response'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server_error'
