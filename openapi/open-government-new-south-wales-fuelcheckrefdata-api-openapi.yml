components:
  schemas:
    reference_data_v2:
      type: object
      required:
      - brands
      - fueltypes
      - stations
      - trendperiods
      - sortfields
      - priceunits
      - lastmodifiedtimestamps
      properties:
        brands:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                title: brand
                required:
                - name
                - state
                properties:
                  name:
                    type: string
                  state:
                    type: string
                    example: NSW
        fueltypes:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                title: fueltype
                required:
                - code
                - name
                - state
                properties:
                  code:
                    type: string
                    example: EV
                  name:
                    type: string
                    example: EV charge
                  state:
                    type: string
                    example: NSW
        stations:
          type: object
          properties:
            items:
              type: array
              items:
                title: station
                type: object
                required:
                - brandid
                - stationid
                - brand
                - code
                - name
                - address
                - location
                - state
                properties:
                  brandid:
                    type: string
                  stationid:
                    type: string
                  brand:
                    type: string
                  code:
                    type: string
                  name:
                    type: string
                  address:
                    type: string
                  location:
                    type: object
                    required:
                    - latitude
                    - longitude
                    properties:
                      latitude:
                        type: number
                        example: '-30.286083'
                      longitude:
                        type: number
                        example: '153.124146'
                  state:
                    type: string
                    example: NSW
        trendperiods:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                title: trendperiod
                required:
                - period
                - description
                properties:
                  period:
                    type: string
                    example: Day
                  description:
                    type: string
                    example: Price trend today
        sortfields:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                title: sortfield
                required:
                - code
                - name
                properties:
                  code:
                    type: string
                    example: Distance
                  name:
                    type: string
                    example: Sort results by distance from specified location
    reference_data:
      type: object
      required:
      - brands
      - fueltypes
      - stations
      - trendperiods
      - sortfields
      - priceunits
      - lastmodifiedtimestamps
      properties:
        brands:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                title: brand
                required:
                - name
                properties:
                  name:
                    type: string
        fueltypes:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                title: fueltype
                required:
                - code
                - name
                properties:
                  code:
                    type: string
                    example: EV
                  name:
                    type: string
                    example: EV charge
        stations:
          type: object
          properties:
            items:
              type: array
              items:
                title: station
                type: object
                required:
                - brandid
                - stationid
                - brand
                - code
                - name
                - address
                - location
                properties:
                  brandid:
                    type: string
                  stationid:
                    type: string
                  brand:
                    type: string
                  code:
                    type: string
                  name:
                    type: string
                  address:
                    type: string
                  location:
                    type: object
                    required:
                    - latitude
                    - longitude
                    properties:
                      latitude:
                        type: number
                        example: '-30.286083'
                      longitude:
                        type: number
                        example: '153.124146'
        trendperiods:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                title: trendperiod
                required:
                - period
                - description
                properties:
                  period:
                    type: string
                    example: Day
                  description:
                    type: string
                    example: Price trend today
        sortfields:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                title: sortfield
                required:
                - code
                - name
                properties:
                  code:
                    type: string
                    example: Distance
                  name:
                    type: string
                    example: Sort results by distance from specified location
    error_response:
      type: object
      required:
      - errorDetails
      properties:
        errorDetails:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: '-2146233033'
            message:
              type: string
              example: String was not recognized as a valid DateTime.
