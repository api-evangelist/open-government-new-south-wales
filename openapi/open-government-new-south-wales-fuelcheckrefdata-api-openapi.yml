  /FuelCheckRefData/v2/fuel/lovs:
    get:
      tags:
      - FuelCheckRefData
      description: Returns lists of reference data to be used in subsequent requests. It is recommended to execute this call in a separate api client as response can be over 2 mb. This API can return data for NSW and TAS.
      summary: Get Reference Data
      deprecated: false
      parameters:
