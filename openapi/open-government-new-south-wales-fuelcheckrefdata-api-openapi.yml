        schema:
          type: string
      - name: transactionid
        in: header
        required: true
        description: Unique ID of this call
        schema:
          type: string
      - name: requesttimestamp
        in: header
        required: true
        description: UTC date and time of request. Format dd/MM/yyyy hh:mm:ss AM/PM
        schema:
          type: string
      - name: if-modified-since
        in: header
        required: true
        description: UTC date and time of request. Format dd/MM/yyyy hh:mm:ss AM/PM
        schema:
          type: string
      - name: states
        in: query
        required: false
        description: A '|' delimited list of the states that you want a List of Values (LOVs) for, e.g. 'NSW|TAS' will give you the LOVs for NSW and TAS. Omitting this argument (or leaving it empty) will result in LOVs for NSW.
