        required: true
        description: The licence number to be verified.
        schema:
          type: string
          default: '10055055'
      - name: Authorization
        in: header
        required: true
        description: Bearer {token}, where <b>{token}</b> is the value obtained from accesstoken call under security.
        schema:
          type: string
          default: Bearer {token}
      - name: apikey
        in: header
        required: true
        description: Api key value obtained from your approved app.
        schema:
          type: string
      responses:
        '200':
          description: Success
