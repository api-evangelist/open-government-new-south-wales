openapi: 3.2.0
info:
  title: Open Government New South Wales Pharmacyregister API
  version: 1.0.0
  contact: {}
  description: 'Operations tagged Pharmacyregister across 2 of this provider''s published API definitions: open-government-new-south-wales-pharmacy-register-swagger.json, open-government-new-south-wales-pharmacy-register-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.onegov.nsw.gov.au/
tags:
- name: Pharmacyregister
paths:
  /pharmacyregister/v1/licence/search/query:
    post:
      tags:
      - Pharmacyregister
      description: Returns licences for the given search criteria.
      summary: Search licences
      deprecated: true
      parameters:
      - name: Authorization
        in: header
        required: true
        description: '''Bearer {token}'', where <b>{token}</b> is the value obtained from accesstoken call under security.'''
        schema:
          type: string
          default: Bearer YOUR_ACCESS_TOKEN
      - name: Content-Type
        in: header
        required: true
        description: Content-Type should be 'application/json'
        schema:
          type: string
          default: application/json
      - name: apikey
        in: header
        required: true
        description: Api key value obtained from your approved app.
        schema:
          type: string
          default: YOUR_API_KEY
      responses:
        '200':
          description: Success
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/licences_search_response'
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/licences_search_request'
        required: true
      operationId: postPharmacyregisterV1LicenceSearchQuery
      x-operation-id-source: derived
    servers:
    - url: https://api.onegov.nsw.gov.au/
  /pharmacyregister/v1/licence/search/details/pharmacy/{licenceId}:
    get:
      tags:
      - Pharmacyregister
      description: Returns licence details for the given licence type and identifier.
      summary: Get licence details
      deprecated: true
      parameters:
      - name: licenceId
        in: path
        required: true
        description: Id of the licence, e.g. a835g000000sm33AAA
        schema:
          type: string
          default: a835g000000sm33AAA
      - name: Authorization
        in: header
        required: true
        description: '''Bearer {token}'', where <b>{token}</b> is the value obtained from accesstoken call under security.'''
        schema:
          type: string
          default: Bearer YOUR_ACCESS_TOKEN
      - name: Content-Type
        in: header
        required: true
        description: Content-Type should be 'application/json'
        schema:
          type: string
          default: application/json
      - name: apikey
        in: header
        required: true
        description: Api key value obtained from your approved app.
        schema:
          type: string
          default: YOUR_API_KEY
      responses:
        '200':
          description: Success
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/licence_details_response'
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
      operationId: getPharmacyregisterV1LicenceSearchDetailsPharmacyByLicenceId
      x-operation-id-source: derived
    servers:
    - url: https://api.onegov.nsw.gov.au/
