  contact: {}
  version: '1.0'
  description: 'Operations tagged Security across 12 of this provider''s published API definitions: open-government-new-south-wales-fuel-swagger.json, open-government-new-south-wales-home-building-compensation-swagger.json, open-government-new-south-wales-pharmacy-register-swagger.json, open-government-new-south-wales-property-swagger.json, open-government-new-south-wales-security-swagger.json, open-government-new-south-wales-trades-swagger.json, open-government-new-south-wales-fuel-openapi.yml, open-government-new-south-wales-home-building-compensation-openapi.yml, open-government-new-south-wales-pharmacy-register-openapi.yml, open-government-new-south-wales-property-openapi.yml, open-government-new-south-wales-security-openapi.yml, open-government-new-south-wales-trades-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.onegov.nsw.gov.au/
- url: https://api.onegov.nsw.gov.au
tags:
- name: Security
paths:
  /oauth/client_credential/accesstoken:
    get:
      tags:
      - Security
      description: The client can request an access token using only its client credentials (or other supported means of authentication) when the client is requesting access to the protected resources under its control, or those of another resource owner that have been previously arranged with the authorization server.
      summary: Oauth
      operationId: OauthClientCredentialAccesstokenGet
      deprecated: false
      parameters:
      - in: query
        name: grant_type
        required: true
        description: client_credentials
        schema:
          type: string
      - in: header
        name: Authorization
        required: true
        description: Base64 encoded value of <b>api_key:api_secret</b>. Eg 'Basic {Base64 encoded value of <b>api_key:api_secret</b>}'
        schema:
          type: string
      responses:
        '200':
          description: Success
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_token_response'
        '401':
          description: Unauthorized
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/access_token_failed_response'
      security: []
    servers:
    - url: https://api.onegov.nsw.gov.au/
